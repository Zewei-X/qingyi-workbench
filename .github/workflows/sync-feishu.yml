name: Sync Feishu catalog

on:
  schedule:
    # 每 15 分钟
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Feishu → workbench sync
        env:
          SYNC_URL: ${{ secrets.SYNC_FEISHU_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ]; then
            SYNC_URL="https://vc-workbench.pages.dev/api/sync-feishu"
          fi
          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "Missing GitHub secret SYNC_SECRET" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/sync-body.json -w "%{http_code}" \
            -X POST "$SYNC_URL" \
            -H "content-type: application/json" \
            -H "x-sync-secret: $SYNC_SECRET")
          echo "HTTP $code"
          cat /tmp/sync-body.json
          echo
          test "$code" = "200"
